<svg xmlns="http://www.w3.org/2000/svg" width="720" height="310" viewBox="0 0 720 310" role="img" aria-label="Linguagens dos projetos analisados">
<style>
.title{fill:#f4fff4;font:700 22px Arial,sans-serif}.sub{fill:#b4c9b8;font:13px Arial,sans-serif}
.label{fill:#bfd3c3;font:13px Arial,sans-serif}.value{fill:#8df3a0;font:700 34px Arial,sans-serif}
.bar{fill:#5dcf77;transform-origin:left;animation:grow 1.1s ease-out both}.fade{animation:appear .8s ease-out both}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes grow{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){.bar,.fade{animation:none}}
</style>
<rect width="719" height="309" x=".5" y=".5" rx="16" fill="#141b16" stroke="#304637"/>
<text class="title" x="30" y="44">Linguagens dos projetos analisados</text><text class="sub" x="30" y="67">Bytes dos repositórios; não apenas código de minha autoria</text>
<text class="label" x="30" y="104">Python</text><rect x="215" y="89" width="410" height="12" rx="6" fill="#304637"/><rect class="bar" x="215" y="89" width="171" height="12" rx="6" style="animation-delay:0ms"/><text class="label" x="640" y="104">41.7%</text>
<text class="label" x="30" y="142">JavaScript</text><rect x="215" y="127" width="410" height="12" rx="6" fill="#304637"/><rect class="bar" x="215" y="127" width="165" height="12" rx="6" style="animation-delay:120ms"/><text class="label" x="640" y="142">40.3%</text>
<text class="label" x="30" y="180">CSS</text><rect x="215" y="165" width="410" height="12" rx="6" fill="#304637"/><rect class="bar" x="215" y="165" width="69" height="12" rx="6" style="animation-delay:240ms"/><text class="label" x="640" y="180">16.8%</text>
<text class="label" x="30" y="218">HTML</text><rect x="215" y="203" width="410" height="12" rx="6" fill="#304637"/><rect class="bar" x="215" y="203" width="3" height="12" rx="6" style="animation-delay:360ms"/><text class="label" x="640" y="218">0.7%</text>
<text class="label" x="30" y="256">PowerShell</text><rect x="215" y="241" width="410" height="12" rx="6" fill="#304637"/><rect class="bar" x="215" y="241" width="2" height="12" rx="6" style="animation-delay:480ms"/><text class="label" x="640" y="256">0.4%</text></svg>
