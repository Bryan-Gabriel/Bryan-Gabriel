name: Atualizar estatisticas completas do perfil

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: combined-profile-stats
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter o repositorio do perfil
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Gerar cartoes combinados
        env:
          PROFILE_STATS_USER: Bryan-Gabriel
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
          PROFILE_STATS_REPOS: ${{ secrets.PROFILE_STATS_REPOS }}
        run: python scripts/private_stats.py

      - name: Publicar apenas os cartoes e o trecho do README
        run: |
          git add -- README.md assets/profile-activity.svg assets/profile-contributions.svg assets/profile-languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Atualizar estatisticas completas do perfil'
          git push
